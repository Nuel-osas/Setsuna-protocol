<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&display=block" rel="stylesheet">
<style>
:root{--deep:#020b16;--ocean:#0c6fb2;--sea:#1690cf;--cyan:#53defd;--foam:#eaf9ff}
body{margin:0;background:#06121f;font-family:Geist,system-ui,sans-serif;color:#eaf9ff}
.wrap{width:1600px;padding:56px;box-sizing:border-box}
h1{font-weight:500;font-size:28px;margin:0 0 6px;letter-spacing:-.01em}
.sub{font:13px 'Geist Mono',monospace;color:#7fa9c4;margin-bottom:36px}
.row{display:grid;grid-template-columns:260px 300px 300px 220px 1fr;gap:20px;align-items:center;padding:26px 0;border-top:1px solid rgba(234,249,255,.08)}
.name b{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em}
.name span{font:12.5px 'Geist Mono',monospace;color:#7fa9c4;line-height:1.5;display:block;margin-top:8px}
.tile{height:220px;border-radius:22px;display:grid;place-items:center}
.dark{background:linear-gradient(180deg,#0c6fb2,#020b16)}
.light{background:#eaf9ff}
.icon{display:flex;gap:18px;align-items:flex-end}
.app{width:120px;height:120px;border-radius:28px;background:linear-gradient(160deg,#53defd 0%,#1690cf 38%,#0c4f86 75%,#031a30 100%);display:grid;place-items:center;box-shadow:0 18px 40px -16px rgba(0,0,0,.6)}
.small{display:flex;flex-direction:column;gap:10px;align-items:center}
.lock{display:flex;align-items:center;gap:16px;font:600 44px Geist,sans-serif;letter-spacing:-.035em}
</style></head><body><div class="wrap">
<h1>Setsuna — logo concepts</h1>
<div class="sub">Simple geometric marks · ocean palette from the reference · tested at 120, 32 and 16 px</div>
<div id="rows"></div>
</div>
<script src="marks.js"></script>
<script>
const info={
 split:['A · Split Second','A disc cut in half. The right half lifted, the instant a position is pulled back up. Reads at any size.'],
 rebound:['B · Rebound','A line falls, touches bottom, springs back higher than it began. The product in one stroke.'],
 tide:['C · Tide S','An S drawn as one wave. Letter, motion and ocean in a single line.'],
 moment:['D · Moment','A ring with one cut and a point. The cut is the instant; the point is the action.']};
const svg=(k,fg,s)=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64">${marks[k](fg)}</svg>`;
document.getElementById('rows').innerHTML=Object.keys(marks).map(k=>`
<div class="row">
 <div class="name"><b>${info[k][0]}</b><span>${info[k][1]}</span></div>
 <div class="tile dark">${svg(k,'#eaf9ff',150)}</div>
 <div class="tile light">${svg(k,'#0a4f88',150)}</div>
 <div class="icon"><div class="app">${svg(k,'#ffffff',72)}</div>
   <div class="small">${svg(k,'#eaf9ff',32)}${svg(k,'#eaf9ff',16)}</div></div>
 <div class="lock">${svg(k,'#53defd',52)}<span>setsuna</span></div>
</div>`).join('');
</script></body></html>
